name: Offline Core

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout public core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Import public modules and check CLI
        run: |
          python -I -S -B - <<'PY'
          import importlib
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('src').resolve()))
          modules = []
          for path in sorted(Path('src/macr').rglob('*.py')):
              if path.name.startswith('._'):
                  continue
              name = '.'.join(path.relative_to('src').with_suffix('').parts)
              name = name.removesuffix('.__init__')
              importlib.import_module(name)
              modules.append(name)
          print(f'Imported {len(modules)} public modules; Python {sys.version.split()[0]}')
          PY
          python -I -S -B cli/agent_review.py --help

      - name: Contracts and fixture lifecycle
        run: >-
          python -I -S -B scripts/run_offline_tests.py
          test_offline_tests test_contracts test_provider_contract test_check_results
          test_local_http_provider test_pr_reviewer test_pr_outputs

      - name: Repository graph and index
        run: >-
          python -I -S -B scripts/run_offline_tests.py
          test_code_graph test_repository_scope test_repository_index

      - name: Source readers and evidence
        run: >-
          python -I -S -B scripts/run_offline_tests.py
          test_context_reader test_static_readers

      - name: Final review uses distinct retrieved sources
        run: >-
          python -I -S -B scripts/run_offline_tests.py
          test_final_reviewer
          test_evidence_store
          test_agent_evidence_integration
          test_orchestrator.OrchestratorTests.test_final_review_receives_store_evidence_after_recovery

      - name: Snapshots and static facts
        run: >-
          python -I -S -B scripts/run_offline_tests.py
          test_repository_snapshots
          test_static_facts.StaticFactsTests.test_cross_file_alias_returns_are_source_facts_not_runtime_flow
          test_static_facts.StaticFactsTests.test_argument_expressions_locations_and_direct_scalars_are_source_faithful
          test_static_facts.StaticFactsTests.test_literal_argument_does_not_promote_declared_bool_or_call_result_to_a_value
          test_static_facts.VisibleSourceObservationTests
          test_static_locate_abstention

      - name: Persistence recovery and synthetic CLI
        run: >-
          python -I -S -B scripts/run_offline_tests.py
          test_trace_store test_atomic_file test_run_store test_run_recovery
          test_static_baseline.StaticBaselineTests.test_real_cli_wrapper_runs_baseline_without_importing_source
          test_static_baseline.StaticBaselineTests.test_strict_input_and_existing_output_fail_before_mutation
          test_static_baseline.StaticBaselineTests.test_cli_rejection_preserves_json_and_exit2

      - name: Diagnostic comparison with scripted responses
        run: >-
          python -I -S -B scripts/run_offline_tests.py
          test_diagnostic_compare test_diagnostic_allocation
          test_b11521_evidence
          test_diagnosis_constraints test_diagnostic_review
          test_diagnostic_verification test_diagnostic_prompt_variants test_diagnostic_pipeline_cli
          test_diagnostic_compact test_diagnostic_orchestrator
          test_diagnostic_dataset test_diagnostic_holdout_cases test_diagnostic_holdout_replay

      - name: Static evidence contracts and CLI without native dispatch
        run: python -I -S -B scripts/run_static_evidence_tests.py

      - name: Bounded kernel loopback lifecycle fixtures
        run: python -I -S -B tests/test_loopback_lifecycle.py

      - name: Bounded local evidence workbench fixtures
        run: python -I -S -B scripts/run_evidence_ui_tests.py

      - name: Offline workbench callback contracts
        run: |
          node --check src/macr/api/evidence_ui/workbench.js
          node scripts/run_evidence_ui_js_tests.cjs

      - name: Bounded failure diagnostic
        if: failure()
        run: |
          python -I -S -B - <<'PY'
          from pathlib import Path
          remaining = 64 * 1024
          for path in sorted(Path('artifacts/test-runs').glob('*/diagnostic.txt')):
              if remaining <= 0:
                  break
              print(f'\n{path}:')
              with path.open('rb') as stream:
                  data = stream.read(remaining)
              print(data.decode('utf-8', errors='replace'))
              remaining -= len(data)
          PY

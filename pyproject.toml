[project]
name = "multi-agent-code-review-lab"
version = "0.1.0"
description = "GitHub-first multi-agent codebase collaboration and evaluation tool."
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}
readme = "README.md"

[project.optional-dependencies]
mock-recovery = [
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-checkpoint==4.2.0",
]

[project.scripts]
agent-review = "macr.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["macr", "macr.*"]
namespaces = false

[tool.setuptools.package-data]
"macr.investigation" = ["static_evidence.schema.json"]
"macr.api" = ["evidence_ui/index.html", "evidence_ui/workbench.js", "evidence_ui/workbench.css"]
